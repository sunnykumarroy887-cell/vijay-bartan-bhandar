<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#124733"><title>Share Feedback | Vijay Bartan Bhandar</title><link rel="stylesheet" href="./feedback.css"><script type="module" src="./customer-feedback.js"></script></head><body><header class="top"><strong>✿ Vijay Bartan Bhandar</strong><a href="./customer-profile.html">← My Account</a></header><main class="wrap"><section class="card"><span class="eyebrow">YOUR VOICE MATTERS</span><h1>Share your feedback</h1><p>Help us improve our website, bartan rental and decoration service.</p><div id="notice" class="notice" role="status" hidden></div><form id="feedbackForm"><label for="category">What is your feedback about?</label><select id="category" required><option value="website">Website experience</option><option value="bartan_rental">Bartan rental</option><option value="decoration">Decoration service</option><option value="other">Other</option></select><label>Rating</label><div class="stars"><label><input type="radio" name="rating" value="5" required> 5 ★</label><label><input type="radio" name="rating" value="4"> 4 ★</label><label><input type="radio" name="rating" value="3"> 3 ★</label><label><input type="radio" name="rating" value="2"> 2 ★</label><label><input type="radio" name="rating" value="1"> 1 ★</label></div><label for="message">Your comments</label><textarea id="message" minlength="3" maxlength="2000" placeholder="Tell us what went well or what we can improve…" required></textarea><p class="meta">Please keep your comments respectful. You must be signed in to submit feedback.</p><button class="btn" id="submitBtn" type="submit">Submit Feedback</button></form><p><a class="back" href="./customer-profile.html">Back to account</a></p></section></main></body></html>
